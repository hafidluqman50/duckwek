name: backend-fly

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-fly.yml'
  workflow_dispatch:

concurrency:
  group: backend-fly
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API
        working-directory: backend
        run: flyctl deploy --remote-only --app duckwek-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
