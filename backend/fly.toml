# fly launch --no-deploy --copy-config && fly secrets set ... && fly deploy
app = "duckwek-api"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # sockets + live races are in memory: keep exactly one machine up
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
