<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sell your part</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@500;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E1446; color: #ffffff; font-family: Rubik, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px 0">
    <a href="MarketPhone.dc.html" aria-label="Back" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #2A1D5E; border: 3px solid #000000; border-radius: 50%; box-shadow: 0 4px 0 #000000"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <div style="font-family: 'Lilita One', sans-serif; font-size: 26px; color: #FFC93C">Sell your part</div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 6px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <div style="flex: 1; padding: 6px 4px; border: 3px solid #000000; border-radius: 12px; background: {{s.bg}}; color: {{s.fg}}; text-align: center; font-size: 11px; font-weight: 900">{{s.label}}</div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pname" style="font-size: 13px; font-weight: 900">Part name</label>
      <input id="pname" type="text" placeholder="[Part name]" style="height: 48px; padding: 0 14px; background: #ffffff; color: #1E1446; border: 4px solid #000000; border-radius: 14px; font-family: Rubik, sans-serif; font-size: 16px; font-weight: 800">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 900">Slot</div>
      <div role="radiogroup" aria-label="Slot" style="display: flex; gap: 6px">
        <sc-for list="{{slots}}" as="o" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="flex: 1; height: 44px; background: {{o.bg}}; color: #1E1446; border: 3px solid #000000; border-radius: 12px; font-size: 14px; font-weight: 900">{{o.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="background: #120B2E; border: 4px solid #000000; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 900"><span>Stat budget</span><span style="color: {{budgetColor}}">{{budgetLabel}}</span></div>
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="flex: 1; font-size: 15px; font-weight: 900">{{s.k}}</span>
          <button type="button" aria-label="Lower {{s.k}}" onClick="{{s.dec}}" style="width: 44px; height: 44px; background: #2A1D5E; color: #ffffff; border: 3px solid #000000; border-radius: 12px; font-size: 22px; font-weight: 900">−</button>
          <span style="width: 40px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700">{{s.v}}</span>
          <button type="button" aria-label="Raise {{s.k}}" onClick="{{s.inc}}" style="width: 44px; height: 44px; background: #FFC93C; color: #1E1446; border: 3px solid #000000; border-radius: 12px; font-size: 22px; font-weight: 900">+</button>
        </div>
      </sc-for>
      <div style="font-size: 11px; font-weight: 700; color: #C9B8FF">Each stat at most +2, all three together at most +2. No part wins every track.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pprice" style="font-size: 13px; font-weight: 900">Price (USDC)</label>
      <input id="pprice" type="text" inputmode="decimal" placeholder="1.00" style="height: 48px; padding: 0 14px; background: #ffffff; color: #1E1446; border: 4px solid #000000; border-radius: 14px; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700">
      <div style="font-size: 12px; font-weight: 800; color: #C9B8FF">You get 85% of each sale, withdrawn from the Vault. 15% to the protocol.</div>
    </div>
  </div>

  <div style="flex: none; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" disabled="{{invalid}}" style="height: 60px; background: {{ctaBg}}; color: #1E1446; border: 4px solid #000000; border-radius: 18px; box-shadow: 0 6px 0 #000000; font-size: 18px; font-weight: 900">Submit for review</button>
    <div style="font-size: 12px; font-weight: 800; color: #C9B8FF; text-align: center">No MON needed. DuckWek mints it for you after review.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { speed: 1, weight: 0, boost: 1, slot: 'wings' };
  }
  renderVals() {
    const s = this.state;
    const sum = s.speed + s.weight + s.boost;
    const ok = sum <= 2 && s.speed <= 2 && s.weight <= 2 && s.boost <= 2;
    const fmt = (v) => (v > 0 ? '+' + v : String(v));
    const mk = (key, label) => ({
      k: label,
      v: fmt(s[key]),
      inc: () => this.setState({ [key]: Math.min(2, s[key] + 1) }),
      dec: () => this.setState({ [key]: Math.max(-2, s[key] - 1) })
    });
    const slot = (id, label) => ({ label: label, on: s.slot === id ? 'true' : 'false', bg: s.slot === id ? '#FFC93C' : '#ffffff', pick: () => this.setState({ slot: id }) });
    return {
      stats: [mk('speed', 'Speed'), mk('weight', 'Weight'), mk('boost', 'Boost')],
      slots: [slot('wings', 'Wings'), slot('tail', 'Tail'), slot('bill', 'Bill')],
      budgetLabel: (ok ? '' : 'Over budget · ') + 'total ' + fmt(sum) + ' / +2',
      budgetColor: ok ? '#B8F35A' : '#F25F5C',
      invalid: !ok,
      ctaBg: ok ? '#FFC93C' : '#3A2E70',
      steps: [
        { label: '1 · Submit', bg: '#FFC93C', fg: '#1E1446' },
        { label: '2 · Review', bg: '#2A1D5E', fg: '#C9B8FF' },
        { label: '3 · Live in Market', bg: '#2A1D5E', fg: '#C9B8FF' }
      ]
    };
  }
}
</script>
</body>
</html>
