<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Market parts phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@500;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #836EF9; color: #1E1446; font-family: Rubik, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0">
    <div style="font-family: 'Lilita One', sans-serif; font-size: 24px; color: #FFC93C; -webkit-text-stroke: 4px #000; paint-order: stroke fill">DUCKWEK</div>
    <button type="button" aria-label="Open wallet" style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 6px; background: #1E1446; color: #FFC93C; border: 3px solid #000000; border-radius: 999px; box-shadow: 0 4px 0 #000000; font-size: 14px; font-weight: 900"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFC93C; border: 2px solid #000000"></span>[BAL] USDC</button>
  </header>
  <div style="flex: none; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="font-family: 'Lilita One', sans-serif; font-size: 38px; line-height: 1; color: #ffffff; -webkit-text-stroke: 5px #000; paint-order: stroke fill">Market</div>
    <div role="tablist" aria-label="Market sections" style="display: flex; gap: 4px; padding: 4px; background: #1E1446; border: 3px solid #000000; border-radius: 999px">
      <a href="#" role="tab" aria-selected="true" style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFC93C; color: #1E1446; border: 3px solid #000000; font-size: 14px; font-weight: 900; text-decoration: none">Parts</a>
      <a href="CircuitsPhone.dc.html" role="tab" aria-selected="false" style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #ffffff; font-size: 14px; font-weight: 900; text-decoration: none">Circuits</a>
      <a href="#" role="tab" aria-selected="false" style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #C9B8FF; font-size: 14px; font-weight: 900; text-decoration: none">Resale · Q4</a>
    </div>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{parts}}" as="p" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px; background: #ffffff; border: 4px solid #000000; border-radius: 20px; box-shadow: 0 5px 0 #000000">
        <div style="flex: none; width: 76px; height: 64px; background: {{p.bg}}; border: 3px solid #000000; border-radius: 14px; display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 150 105" width="66" aria-hidden="true" style="overflow: visible"><polygon points="40,72 56,54 94,52 122,62 118,86 84,98 50,94" fill="#FFC93C" stroke="#000" stroke-width="6" stroke-linejoin="round"></polygon><polygon points="{{p.part}}" fill="{{p.partFill}}" stroke="#000" stroke-width="5" stroke-linejoin="round"></polygon><polygon points="88,52 90,30 106,20 120,28 122,48 110,58" fill="#FFC93C" stroke="#000" stroke-width="6" stroke-linejoin="round"></polygon><polygon points="120,32 140,39 120,46" fill="#FF9F1C" stroke="#000" stroke-width="5"></polygon></svg>
        </div>
        <div style="flex: 1; min-width: 0">
          <div style="font-family: 'Lilita One', sans-serif; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</div>
          <div style="font-size: 12px; font-weight: 800; color: #5B4AB8">{{p.slot}} · {{p.stats}}</div>
          <div style="font-size: 11px; font-weight: 800; color: #5B4AB8">by {{p.by}}</div>
        </div>
        <button type="button" style="flex: none; height: 44px; padding: 0 12px; background: #FFC93C; color: #1E1446; border: 3px solid #000000; border-radius: 14px; box-shadow: 0 4px 0 #000000; font-size: 13px; font-weight: 900">{{p.price}}</button>
      </div>
    </sc-for>
    <a href="CreatorSubmit.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #1E1446; color: #ffffff; border: 4px dashed #FFC93C; border-radius: 20px; text-decoration: none"><span style="font-size: 15px; font-weight: 900">Sell your own part</span><span style="font-size: 12px; font-weight: 800; color: #FFC93C">earn 85% →</span></a>
  </div>
  <nav aria-label="Main" style="flex: none; display: flex; gap: 6px; padding: 8px 12px 14px; background: #1E1446; border-top: 4px solid #000000">
    <a href="#" style="flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #2A1D5E; color: #ffffff; border: 3px solid #000000; border-radius: 14px; text-decoration: none"><span style="font-size: 15px; font-weight: 900">Home</span><span style="font-size: 10px; font-weight: 800; opacity: 0.8">rooms</span></a>
    <a href="#" style="flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #2A1D5E; color: #ffffff; border: 3px solid #000000; border-radius: 14px; text-decoration: none"><span style="font-size: 15px; font-weight: 900">My Duck</span><span style="font-size: 10px; font-weight: 800; opacity: 0.8">parts &amp; look</span></a>
    <a href="#" aria-current="page" style="flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFC93C; color: #1E1446; border: 3px solid #000000; border-radius: 14px; text-decoration: none"><span style="font-size: 15px; font-weight: 900">Market</span><span style="font-size: 10px; font-weight: 800; opacity: 0.8">parts · circuits</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const W = '58,66 98,34 110,40 90,74', T = '36,64 6,52 16,72 6,92 38,84', B = '118,30 147,39 118,48';
    return {
      parts: [
        { name: 'Layangan Wings', price: '1 USDC', slot: 'Wings', stats: 'S+2 W0 B−1', by: 'DuckWek', bg: '#7CC6FE', part: W, partFill: '#ffffff' },
        { name: 'Turbo Tail', price: '1 USDC', slot: 'Tail', stats: 'S+1 W+1 B0', by: 'DuckWek', bg: '#FF7AB6', part: T, partFill: '#FF9F1C' },
        { name: 'Iron Bill', price: 'Owned', slot: 'Bill', stats: 'S−1 W+1 B+2', by: 'DuckWek', bg: '#B8F35A', part: B, partFill: '#9AA3B8' },
        { name: '[Creator part]', price: '[PRICE]', slot: 'Wings', stats: '[stats]', by: '0x…[creator]', bg: '#7CC6FE', part: W, partFill: '#F25F5C' }
      ]
    };
  }
}
</script>
</body>
</html>
