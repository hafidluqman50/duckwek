<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part slot frames</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@500;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes rFloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes rSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 1680px; height: 620px; box-sizing: border-box; padding: 40px; background: #120B2E; font-family: Rubik, system-ui, sans-serif; color: #1E1446; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px">
  <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
    <div style="position: relative; height: 540px; overflow: hidden; background: #1E1446; border: 10px solid {{c.frame}}; border-radius: 40px; box-shadow: 0 0 0 6px #000000, 0 12px 0 6px #000000; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 26px; box-sizing: border-box">
      <sc-if value="{{c.rays}}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="position: absolute; left: 50%; top: 42%; width: 700px; height: 700px; margin: -350px 0 0 -350px; border-radius: 50%; background: repeating-conic-gradient({{c.ray}} 0 10deg, #1E1446 10deg 20deg); animation: rSpin 24s linear infinite"></div>
      </sc-if>
      <span style="position: relative; align-self: flex-start; padding: 6px 16px; background: {{c.frame}}; border: 4px solid #000000; border-radius: 999px; font-size: 20px; font-weight: 900; letter-spacing: 2px">{{c.rarity}}</span>
      <div style="position: relative; animation: rFloat 2.4s ease-in-out infinite">
        <svg viewBox="{{c.vb}}" width="260" aria-hidden="true" style="display: block; overflow: visible"><polygon points="{{c.part}}" fill="{{c.fill}}" stroke="#000" stroke-width="3" stroke-linejoin="round"></polygon></svg>
      </div>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div style="font-family: 'Lilita One', sans-serif; font-size: 44px; color: #ffffff; -webkit-text-stroke: 6px #000; paint-order: stroke fill">{{c.name}}</div>
        <div style="font-size: 18px; font-weight: 900; color: {{c.frame}}">{{c.fx}}</div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cards: [
        { rarity: 'WINGS · SPEED BUILD', frame: '#7CC6FE', rays: true, ray: '#2A1D5E', name: 'Layangan Wings', fx: 'Best on: [track from fit data]', vb: '50 25 70 55', part: '58,66 98,34 110,40 90,74', fill: '#ffffff' },
        { rarity: 'TAIL · ALL-ROUND', frame: '#FF7AB6', rays: true, ray: '#2A1D5E', name: 'Turbo Tail', fx: 'Best on: [track from fit data]', vb: '0 45 45 55', part: '36,64 6,52 16,72 6,92 38,84', fill: '#FF9F1C' },
        { rarity: 'BILL · BOOST BUILD', frame: '#B8F35A', rays: true, ray: '#2A1D5E', name: 'Iron Bill', fx: 'Best on: [track from fit data]', vb: '112 22 40 34', part: '118,30 147,39 118,48', fill: '#9AA3B8' }
      ]
    };
  }
}
</script>
</body>
</html>
