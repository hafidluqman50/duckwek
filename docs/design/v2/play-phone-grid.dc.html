<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone grid slot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@500;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes dwBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E1446; color: #ffffff; font-family: Rubik, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0">
    <div style="font-family: 'Lilita One', sans-serif; font-size: 24px; color: #FFC93C; -webkit-text-stroke: 4px #000; paint-order: stroke fill">DUCKWEK</div>
    <span style="padding: 4px 12px; border: 3px solid #000000; border-radius: 999px; background: #FFC93C; color: #1E1446; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px">[ROOM]</span>
  </header>

  <div style="padding: 18px 16px 0; display: flex; align-items: center; justify-content: space-between">
    <div>
      <div style="font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #C9B8FF">YOUR GRID SLOT</div>
      <div style="font-family: 'Lilita One', sans-serif; font-size: 64px; line-height: 1; color: #FFC93C; -webkit-text-stroke: 5px #000; paint-order: stroke fill">P5</div>
      <div style="font-size: 15px; font-weight: 800">Row 2 · middle · of [N]</div>
    </div>
    <div style="width: 104px; height: 104px; border-radius: 50%; background: #FFC93C; color: #1E1446; border: 5px solid #000000; box-shadow: 0 7px 0 #000000; display: flex; flex-direction: column; align-items: center; justify-content: center">
      <div style="font-size: 12px; font-weight: 900">GO IN</div>
      <div style="font-family: 'Lilita One', sans-serif; font-size: 56px; line-height: 0.9">5</div>
    </div>
  </div>

  <!-- local grid: your row, one ahead, one behind; front at the top -->
  <div style="margin: 18px 16px 0; flex: 1; position: relative; background: #2A1D5E; border: 5px solid #000000; border-radius: 28px; box-shadow: 0 9px 0 #000000; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 30px; background: repeating-conic-gradient(#ffffff 0 25%, #000000 0 50%) 0 0 / 15px 15px; border-bottom: 4px solid #000000"></div>
    <div style="position: absolute; left: 0; right: 0; top: 34px; text-align: center; font-size: 11px; font-weight: 900; letter-spacing: 2px; color: #C9B8FF">START · POLE AHEAD</div>
    <sc-for list="{{slots}}" as="s" hint-placeholder-count="9">
      <div style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: 96px; height: 96px">
        <div aria-hidden="true" style="position: absolute; inset: 0; border: 4px solid {{s.line}}; border-bottom: 0; border-radius: 6px 6px 0 0"></div>
        <div style="position: absolute; right: 6px; bottom: 2px; font-family: 'Lilita One', sans-serif; font-size: 24px; color: #C9B8FF">{{s.pos}}</div>
        <div style="position: absolute; left: 20px; top: 14px; transform: rotate(-90deg); animation: dwBob {{s.bob}} ease-in-out infinite">
          <svg viewBox="0 0 120 100" width="{{s.w}}" aria-hidden="true"><polygon points="10,60 30,40 70,38 100,50 95,75 60,88 25,84" fill="{{s.color}}" stroke="#000" stroke-width="7" stroke-linejoin="round"></polygon><polygon points="70,40 72,18 88,8 102,16 104,36 92,46" fill="{{s.color}}" stroke="#000" stroke-width="7" stroke-linejoin="round"></polygon><polygon points="102,20 119,27 102,34" fill="#FF9F1C" stroke="#000" stroke-width="6"></polygon></svg>
        </div>
      </div>
    </sc-for>
    <div style="position: absolute; left: 134px; top: 210px; padding: 2px 10px; border: 3px solid #000000; border-radius: 999px; background: #FFC93C; color: #1E1446; font-size: 13px; font-weight: 900">You</div>
    <div style="position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 13px; font-weight: 800; color: #C9B8FF">Look up: the projector is flying over the grid.</div>
  </div>

  <div style="padding: 18px 16px 22px">
    <button type="button" disabled style="width: 100%; height: 64px; background: #3A2E70; color: #C9B8FF; border: 4px solid #000000; border-radius: 20px; font-family: 'Lilita One', sans-serif; font-size: 30px">CHEER opens at GO</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cols = ['#4ED1C5', '#FF7AB6', '#ffffff', '#7CC6FE', '#FFC93C', '#B8F35A', '#FF9F1C', '#C9B8FF', '#F25F5C'];
    const slots = [];
    for (let r = 0; r < 3; r++) {
      for (let k = 0; k < 3; k++) {
        const i = r * 3 + k;
        const me = i === 4;
        slots.push({ x: 14 + k * 110, y: 60 + r * 150 + k * 26, pos: String(i + 1), color: me ? '#FFC93C' : cols[i], line: me ? '#FFC93C' : '#ffffff', w: me ? 66 : 56, bob: (0.9 + k * 0.15).toFixed(2) + 's' });
      }
    }
    return { slots: slots };
  }
}
</script>
</body>
</html>
