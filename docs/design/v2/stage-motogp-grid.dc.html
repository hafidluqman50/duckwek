<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage starting grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@500;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes dwBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes dwPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #1E1446; color: #ffffff; font-family: Rubik, system-ui, sans-serif">

  <!-- header -->
  <div style="position: absolute; left: 110px; top: 44px">
    <div style="font-size: 26px; font-weight: 900; letter-spacing: 4px; color: #C9B8FF">[CODE] · KALI CODE SPRINT · 3 LAPS · [N] DUCKS</div>
    <div style="font-family: 'Lilita One', sans-serif; font-size: 96px; line-height: 1; color: #FFC93C; text-shadow: 0 8px 0 #836EF9">STARTING GRID</div>
  </div>
  <div style="position: absolute; right: 110px; top: 34px; width: 160px; height: 160px; border-radius: 50%; background: #FFC93C; color: #1E1446; border: 6px solid #000000; box-shadow: 0 10px 0 #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: dwPulse 1s ease-in-out infinite">
    <div style="font-size: 18px; font-weight: 900">GO IN</div>
    <div style="font-family: 'Lilita One', sans-serif; font-size: 96px; line-height: 0.9">5</div>
  </div>
  <div style="position: absolute; right: 300px; top: 92px; padding: 10px 22px; background: #ffffff; color: #1E1446; border: 5px solid #000000; border-radius: 999px; box-shadow: 0 6px 0 #000000; font-size: 26px; font-weight: 900">CAMERA · ROWS 1–8 → BACK OF THE GRID</div>

  <!-- asphalt -->
  <div style="position: absolute; left: 60px; top: 230px; width: 1800px; height: 660px; background: #2A1D5E; border: 6px solid #000000; border-radius: 40px; box-shadow: 0 14px 0 #000000; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 26px; background: repeating-linear-gradient(90deg, #F25F5C 0 60px, #ffffff 60px 120px); border-bottom: 5px solid #000000"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: repeating-linear-gradient(90deg, #ffffff 0 60px, #F25F5C 60px 120px); border-top: 5px solid #000000"></div>
    <div aria-hidden="true" style="position: absolute; left: 1630px; top: 26px; bottom: 26px; width: 48px; background: repeating-conic-gradient(#ffffff 0 25%, #000000 0 50%) 0 0 / 24px 24px; border-left: 5px solid #000000; border-right: 5px solid #000000"></div>
    <div style="position: absolute; left: 1700px; top: 300px; transform: rotate(90deg); transform-origin: left top; font-family: 'Lilita One', sans-serif; font-size: 34px; color: #FFC93C; white-space: nowrap">START</div>

    <sc-for list="{{slots}}" as="s" hint-placeholder-count="24">
      <div style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: 150px; height: 140px">
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 150px; height: 140px; border: 5px solid #ffffff; border-right: 0; border-radius: 6px 0 0 6px; box-sizing: border-box"></div>
        <div style="position: absolute; left: 10px; bottom: 6px; font-family: 'Lilita One', sans-serif; font-size: 40px; color: #C9B8FF; opacity: 0.75">{{s.pos}}</div>
        <div style="position: absolute; left: 44px; top: 30px; animation: dwBob {{s.bob}} ease-in-out infinite">
          <svg viewBox="0 0 120 100" width="96" aria-hidden="true"><polygon points="10,60 30,40 70,38 100,50 95,75 60,88 25,84" fill="{{s.color}}" stroke="#000" stroke-width="7" stroke-linejoin="round"></polygon><polygon points="70,40 72,18 88,8 102,16 104,36 92,46" fill="{{s.color}}" stroke="#000" stroke-width="7" stroke-linejoin="round"></polygon><polygon points="102,20 119,27 102,34" fill="#FF9F1C" stroke="#000" stroke-width="6"></polygon><circle cx="91" cy="23" r="4" fill="#000"></circle></svg>
        </div>
        <sc-if value="{{s.human}}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; left: 30px; top: -14px; padding: 2px 12px; border: 4px solid #000000; border-radius: 999px; background: {{s.tagBg}}; color: #1E1446; font-size: 18px; font-weight: 900; white-space: nowrap">{{s.label}}</div>
        </sc-if>
      </div>
    </sc-for>

    <sc-for list="{{rowTags}}" as="r" hint-placeholder-count="8">
      <div style="position: absolute; left: {{r.x}}px; top: 34px; font-size: 16px; font-weight: 900; letter-spacing: 2px; color: #C9B8FF">ROW {{r.n}}</div>
    </sc-for>
  </div>

  <!-- minimap -->
  <div style="position: absolute; left: 110px; right: 110px; top: 926px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-size: 20px; font-weight: 900; letter-spacing: 3px; color: #C9B8FF"><span>BACK OF THE GRID</span><span>WHOLE FIELD · ROWS OF 3 · JOIN ORDER</span><span>POLE →</span></div>
    <div style="position: relative; height: 70px; background: #120B2E; border: 5px solid #000000; border-radius: 22px; display: flex; flex-direction: row-reverse; align-items: center; gap: 4px; padding: 0 14px">
      <sc-for list="{{mini}}" as="m" hint-placeholder-count="67">
        <div style="flex: none; width: 20px; display: flex; flex-direction: column; gap: 3px; align-items: center">
          <span style="width: 10px; height: 10px; border-radius: 50%; background: {{m.c0}}"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: {{m.c1}}; margin-right: 6px"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: {{m.c2}}; margin-right: 12px"></span>
        </div>
      </sc-for>
      <div aria-hidden="true" style="position: absolute; right: 8px; top: -8px; width: 196px; height: 76px; border: 5px solid #FFC93C; border-radius: 16px"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const cols = ['#FFC93C', '#4ED1C5', '#FF7AB6', '#ffffff', '#7CC6FE', '#B8F35A', '#FF9F1C', '#C9B8FF', '#F25F5C', '#836EF9', '#9BE7FF', '#2B2B2B'];
    const humans = { 0: '[Player]', 2: '[Player]', 4: 'You', 9: '[Player]', 13: '[Player]', 17: '[Player]' };
    const slots = [];
    const rowTags = [];
    for (let r = 0; r < 8; r++) {
      const rowX = 1450 - r * 190;
      rowTags.push({ n: r + 1, x: rowX - 70 });
      for (let k = 0; k < 3; k++) {
        const i = r * 3 + k;
        const h = humans[i];
        slots.push({
          x: rowX - k * 55,
          y: 70 + k * 190,
          pos: String(i + 1),
          color: cols[i % cols.length],
          human: !!h,
          label: h ? 'P' + (i + 1) + ' · ' + h : '',
          tagBg: h === 'You' ? '#FFC93C' : '#ffffff',
          bob: (0.9 + (i % 5) * 0.12).toFixed(2) + 's'
        });
      }
    }
    const field = 120;
    const mini = [];
    for (let r = 0; r < 67; r++) {
      const c = (k) => (r * 3 + k < field ? cols[(r * 3 + k) % cols.length] : '#2A1D5E');
      mini.push({ c0: c(0), c1: c(1), c2: c(2) });
    }
    return { slots: slots, rowTags: rowTags, mini: mini };
  }
}
</script>
</body>
</html>
